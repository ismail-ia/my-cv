; Shared PHP runtime tuning. Dev overrides live in 99-dev.ini (dev stage only).
memory_limit = 256M
expose_php = Off
max_execution_time = 60

; Octane/RoadRunner keeps workers resident, so OPcache must hold the whole app.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Workers are immutable in prod: never stat files looking for changes.
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
