# Shared by the :80 and :443 server blocks. Anything that defines how a request
# is routed belongs here, so adding a route cannot accidentally apply to only
# one of the two protocols.

# Upstreams as variables - see the resolver note above.
set $upstream_next    "nextjs:3000";
set $upstream_php     "php:8000";
set $upstream_sockudo "sockudo:6001";

proxy_http_version 1.1;
# $http_host, not $host: $host drops the port, which breaks both Next's
# dev-origin check and Laravel's absolute URL generation behind :8443.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_scheme;
proxy_set_header X-Forwarded-Host  $http_host;

# ---------------------------------------------------------------------
# Sockudo - Pusher-compatible WebSocket + HTTP API.
# The client connects to wss://host/ws/app/<key>; sockudo expects
# /app/<key> at its root, so the /ws prefix is stripped here.
# ---------------------------------------------------------------------
location /ws/ {
    rewrite ^/ws/(.*)$ /$1 break;
    proxy_pass http://$upstream_sockudo;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streaming: buffering here would batch tokens into visible stalls.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# ---------------------------------------------------------------------
# Laravel (Octane / RoadRunner)
# ---------------------------------------------------------------------
location /api/ {
    proxy_pass http://$upstream_php;
    proxy_read_timeout 120s;
}

# Broadcasting auth endpoint for private/presence channels.
location /broadcasting/auth {
    proxy_pass http://$upstream_php;
}

# Laravel health probe (bootstrap/app.php: health: '/up').
location = /up {
    access_log off;
    proxy_pass http://$upstream_php;
}

# ---------------------------------------------------------------------
# Next.js (catch-all)
# ---------------------------------------------------------------------
location / {
    proxy_pass http://$upstream_next;

    # Next dev uses a WebSocket for HMR.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 120s;
}
