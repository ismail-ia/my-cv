<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ismail Ibrahim">
  <title>Ismail Ibrahim — the load-bearing mark</title>
  <!-- BEAM: one unbroken span. The monolith that never got chopped up. -->
  <rect x="8" y="10" width="84" height="17" rx="3" fill="currentColor"/>
  <!-- COLUMNS: the I I monogram, carrying the beam. -->
  <rect x="18" y="33" width="18" height="44" rx="3" fill="currentColor"/>
  <rect x="64" y="33" width="18" height="44" rx="3" fill="currentColor"/>
  <!-- BASE: distributed. Separate pieces, shared load. -->
  <rect x="8"  y="83" width="24" height="9" rx="2.5" fill="currentColor"/>
  <rect x="38" y="83" width="24" height="9" rx="2.5" fill="currentColor"/>
  <rect x="68" y="83" width="24" height="9" rx="2.5" fill="currentColor"/>
</svg>
